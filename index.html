<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@100..900&family=Oswald:wght@200..700&family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#64EEEB",
                        secondary: "#DDE6F2",
                        accent: "#38BDF8",

                        gradientStart: "#5B5FEF",
                        gradientEnd: "#10B981",

                        background: "#F8FAFC",
                        paragraph: "#64748B",

                        btnPrimary: "#2563EB",
                        btnHover: "#48EBFA",

                        heading: "#0F172A",
                        cardBg: "#3D293B"
                    },

                    fontFamily: {
                        bebas: ['"Bebas Neue"', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                        oswald: ['Oswald', 'sans-serif'],
                        roboto:['roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#081F2F]">

    <div class="w-full  mx-auto">
        <div class="header flex items-center bg-[#041E34] justify-between w-full px-3">
            <div class="logo ">
                <a href=""><img class="w-30 h-30" src="images/Logo.png"></a>
            </div>
            <!-- navbar -->
             <div class="navmenu hidden lg:flex">
                <ul class="flex gap-5">
                    <li><a class="text-primary text-sm font-medium font-roboto px-4 py-5 " href="">

                    <li><a class="text-secondary text-sm font-medium font-roboto px-4 py-5" href="">

                    </a></li>
                    <li><a class="text-secondary text-sm font-medium font-roboto px-4 py-5" href="">

                    </a></li>
                    <li><a class="text-secondary text-sm font-medium font-roboto px-4 py-5" href="">

                    </a></li>
                    <li><a class="text-secondary text-sm font-medium font-roboto px-4 py-5" href="">
                          Gallary
                    </a></li>
                </ul>
             </div>

             <!-- icon & button -->
              <div class="icons flex gap-5">
                <div class="fantasy flex gap-2 items-center hidden lg:flex ">
                    <i class="fa-solid fa-trophy text-primary"></i>
                    <span class="text-secondary font-medium font-roboto">Fantasy</span>
                </div>
                 <div class="notification flex gap-2 items-center hidden lg:flex">
                    <i class="fa-solid fa-bell text-primary"></i>
                    <span class="text-secondary font-medium font-roboto">Notification</span>
                </div>
                <button class="px-3 py-1 rounded-md bg-gradient-to-b from-[#00BFFF] to-[#28385D] text-sm font-medium font-roboto text-white">Premium</button>
                <!-- toggle-mobile -->
               <div class="toggle flex items-center flex lg:hidden">
                <i class="fa-solid fa-bars text-primary text-2xl"></i>
               </div>
        </div>
              </div> 
    </div>

<!-- hero section -->

<div class="w-full  mx-auto">
    <div class="hero-image  w-full h-160">
        <div class="image w-full block relative group">

                <div class="overlay absolute inset-0 bg-black/30"></div>

                <!-- scorecard -->
                 <div class="container mx-auto px-3">
                <div class="score-card-live group absolute bottom-[50px] left-[50px]">

                        <span class=" text-white italic font-oswald font-medium uppercase  flex items-center gap-[4px]"> <i class="fa-solid fa-circle text-[12px] text-white"></i>Live</span>
                      </div>
                      

                      <!-- score-board -->

after:absolute
