<!DOCTYPE html>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

                        para: "#A0AEC0",

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<body class="bg-[#0B1E2D]">

                    <li><a class="text-secondary hover:text-primary text-md font-medium font-roboto px-4 py-5   "

                        </a></li>

                            Gallery

                </ul>

                <button

            </div>
        </div>

                </ul>
